# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment mappings - human-readable parameter names for Minecraft code
# (like having type stubs / docstrings for a library you're calling)
neogradle.subsystems.parchment.minecraftVersion=1.21.11
neogradle.subsystems.parchment.mappingsVersion=2025.12.20

# Environment Properties
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.42

## Mod Properties
mod_id=trafficcontrol
mod_name=Traffic Control
mod_license=All Rights Reserved
mod_version=2.0.0
mod_group_id=com.clussmanproductions.trafficcontrol